# Unified Meshtastic Mesh Monitor and Visualizer
# Deploy both services with one command: docker-compose up -d --build
services:
  # Meshtastic Mesh Monitor - Collects data from radio
  mesh-monitor:
    build:
      context: meshtastic_mesh_monitor
      dockerfile: docker/Dockerfile.optimized
    container_name: meshtastic_mesh_monitor
    restart: unless-stopped
    environment:
      # Radio connection (required)
      - TCP_SERVER=${TCP_SERVER:-192.168.68.73}
      
      # AI Configuration (optional but recommended)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      
      # Node position (optional)
      - NODE_LATITUDE=${NODE_LATITUDE}
      - NODE_LONGITUDE=${NODE_LONGITUDE}
      - NODE_ALTITUDE=${NODE_ALTITUDE}
      
      # Application
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # USB device for serial connection (if using serial instead of TCP)
    # Uncomment and set SERIAL_DEVICE in .env to enable serial connections
    # Example: SERIAL_DEVICE=/dev/ttyUSB0 or /dev/ttyACM0
    # devices:
    #   - ${SERIAL_DEVICE}:/dev/ttyUSB0:rw
    
    volumes:
      # Shared data directory for IPC between monitor and visualizer
      - mesh_data:/data
      # Configuration directory
      - ~/mesh_monitor/config:/app/config:ro
      # Logs directory
      - ~/mesh_monitor/logs:/app/logs
    
    # Resource limits
    mem_limit: 256M
    memswap_limit: 256M
    cpus: '0.5'
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    
    networks:
      - mesh-network
    
    # Health check
    healthcheck:
      test: ['CMD', 'python3', '-c', 'import sqlite3; sqlite3("/data/mesh.db").execute("SELECT 1")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Meshtastic Mesh Visualizer - Web UI to view mesh data
  mesh-visualizer:
    build:
      context: meshtastic_mesh_visualizer
      dockerfile: docker/Dockerfile
    container_name: meshtastic_mesh_visualizer
    restart: unless-stopped
    
    # Wait for mesh-monitor to be healthy before starting
    depends_on:
      mesh-monitor:
        condition: service_healthy
    
    environment:
      # Flask configuration
      - FLASK_ENV=production
      - FLASK_APP=app.py
      
      # Data file location (read from mesh-monitor)
      - MESH_DATA_FILE=/data/mesh_data.json
      
      # Application
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    ports:
      # Web UI accessible at localhost:5000
      - '${VISUALIZER_PORT:-5000}:5000'
    
    volumes:
      # Read mesh data from monitor
      - mesh_data:/data:ro
      # Logs directory
      - ~/mesh_visualizer/logs:/app/logs
    
    # Resource limits
    mem_limit: 512M
    memswap_limit: 512M
    cpus: '0.5'
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    
    networks:
      - mesh-network
    
    # Health check
    healthcheck:
      test: ['CMD', 'python', '-c', 'import requests; requests.get("http://localhost:5000/", timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Shared data volume for IPC
volumes:
  mesh_data:
    driver: local

# Network for service-to-service communication
networks:
  mesh-network:
    driver: bridge
